<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ — Escapement</title>
<meta name="description" content="Frequently asked questions about Escapement, a cultivation RPG created in the Blue Mountains, NSW.">
<style>
  :root {
    --bg: #14181d;
    --ink: #e8e0cf;
    --muted: #a99f8a;
    --gold: #d8b45a;
    --rule: #2c333b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.7;
    padding: 3rem 1.25rem 4rem;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 {
    font-size: 1.8rem;
    letter-spacing: 0.12em;
    font-weight: normal;
    color: var(--ink);
    margin-bottom: 1.5rem;
  }
  h3 {
    font-size: 1rem;
    color: var(--ink);
    font-weight: bold;
    margin: 1.5rem 0 0.4rem;
  }
  p { margin: 0.75rem 0; }
  a { color: var(--gold); }
  a:hover { color: #eccd7f; }
  .quiet { color: var(--muted); font-size: 0.95rem; }
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<main>
  <p class="quiet"><a href="/">&larr; escapementgame.com</a></p>

  <h1>FAQ</h1>

  <h3>What platforms will Escapement release on?</h3>
  <p>PC, via Steam.</p>

  <h3>When does it release?</h3>
  <p>No release date has been announced.</p>

  <h3>Is there a Steam page?</h3>
  <p>Not yet.</p>

  <footer>
    <p>Questions not covered here: <a href="mailto:hello@escapementgame.com">hello@escapementgame.com</a></p>
    <p>© 2026 Jake · Blue Mountains, NSW</p>
  </footer>
</main>
<script data-goatcounter="https://escapement.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="mailto:"]');
    if (!a || !window.goatcounter || !window.goatcounter.count) return;
    var box = a.href.replace('mailto:', '').split('@')[0];
    window.goatcounter.count({
      path: 'click-' + box + '-faq',
      title: 'Email link click',
      event: true,
    });
  });
</script>
</body>
</html>
